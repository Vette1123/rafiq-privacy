# Publishes everything the app downloads to Cloudflare (rafiq-cdn.boogado.workers.dev),
# its one host for them: audio/ and fonts/ from here, the recitations from
# Vette1123/rafiq-recitations. Then proves every file is there byte for byte, and that
# audio answers a byte range. cdn/wrangler.jsonc says what runs code and what does not.
#
# A push to rafiq-recitations does not trigger this; run it by hand (workflow_dispatch)
# after adding a recitation, or wait for the weekly verify to flag the gap.
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (the boogado account, as nafis).
name: CDN
on:
  push:
    branches: [main]
    paths: ['audio/**', 'fonts/**', 'cdn/**', '.github/workflows/cdn.yml']
  workflow_dispatch:
  # Weekly: re-verify, so a file lost at the edge is noticed by a red run, not by a user.
  schedule:
    - cron: '23 4 * * 1'
concurrency:
  group: cdn
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Vette1123/rafiq-recitations
          path: _recitations
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the Worker
        run: node --test cdn/worker.test.mjs cdn/verify.test.mjs
      - name: Stage audio/, fonts/ and the recitations
        run: node cdn/stage.mjs --recitations _recitations
      # The hashes live before this deploy, a static file (no Worker request). verify.mjs
      # reads only the audio that changed through the Worker; a 404 (first run) means all.
      - name: Save the live audio hashes
        run: curl -sf https://rafiq-cdn.boogado.workers.dev/_parts/hashes.json -o prev-hashes.json || echo '{}' > prev-hashes.json
      - name: Deploy the assets-only Worker
        if: github.event_name != 'schedule'
        working-directory: cdn
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4 deploy
      - name: Verify every file, byte for byte
        run: node cdn/verify.mjs --tries 6 --recitations _recitations --since prev-hashes.json
