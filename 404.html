<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rafiq Privacy Policy</title>
    <meta name="robots" content="noindex" />
    <!-- Old links (an app-repo Pages path, a mistyped anchor, a renamed file) must never
         dead-end on a privacy policy: Play requires the URL to resolve. Send everything
         to the policy. -->
    <meta http-equiv="refresh" content="0; url=/rafiq-privacy/" />
    <link rel="canonical" href="https://vette1123.github.io/rafiq-privacy/" />
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        margin: 15vh auto;
        max-width: 34rem;
        padding: 0 20px;
        line-height: 1.7;
        color: #171b19;
        background: #faf9f5;
      }
      a {
        color: #7a5f16;
      }
      @media (prefers-color-scheme: dark) {
        body {
          color: #e9efeb;
          background: #0e1614;
        }
        a {
          color: #d6b566;
        }
      }
    </style>
  </head>
  <body>
    <p>Redirecting to the Rafiq privacy policy.</p>
    <p>
      If nothing happens, open
      <a href="https://vette1123.github.io/rafiq-privacy/">vette1123.github.io/rafiq-privacy</a>.
    </p>
    <p lang="ar" dir="rtl">
      جارٍ التحويل إلى سياسة خصوصية رفيق. إن لم يحدث شيء، افتح الرابط أعلاه.
    </p>
  </body>
</html>
